<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slonagent</title>
<style>
    :root {
        --bg: #1e1e2e; --surface: #252536; --border: #333350;
        --text: #cdd6f4; --text-dim: #6c7086; --accent: #89b4fa;
    }
    html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: var(--bg); color: var(--text);
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { display: flex; flex-direction: column; }
    #frame { flex: 1; width: 100%; border: 0; display: none; }
    #config {
        flex: 1; padding: 20px; display: none; flex-direction: column; gap: 12px;
    }
    #config.visible { display: flex; }
    #config h3 { margin: 0; font-size: 14px; color: var(--text); }
    #config p { margin: 0; font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    #config input {
        width: 100%; box-sizing: border-box; padding: 10px;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 4px;
        font: inherit; outline: none;
    }
    #config input:focus { border-color: var(--accent); }
    #config button {
        padding: 10px 16px; background: var(--accent); color: var(--bg);
        border: 0; border-radius: 4px; cursor: pointer;
        font: inherit; font-weight: 600;
    }
    #config button:hover { opacity: 0.85; }
    #reset-btn {
        position: fixed; top: 4px; right: 4px; z-index: 10;
        background: rgba(30, 30, 46, 0.8); color: var(--text-dim);
        border: 1px solid var(--border); border-radius: 3px;
        padding: 2px 8px; font: 10px inherit; cursor: pointer;
        display: none;
    }
    #reset-btn:hover { color: var(--text); background: var(--surface); }
</style>
</head>
<body>
<div id="config">
    <h3>Slonagent URL</h3>
    <p>Paste the URL of your slonagent web_agent (the tunnel URL or
       <code>http://localhost:8765/main/web_agent/</code>).</p>
    <input id="url" placeholder="https://web-xxxxxx.example.com:8443/main/web_agent/">
    <button id="save">Connect</button>
</div>
<iframe id="frame" allow="clipboard-read; clipboard-write"></iframe>
<button id="reset-btn">change URL</button>
<script src="sidepanel.js"></script>
</body>
</html>
